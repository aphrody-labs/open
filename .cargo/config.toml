# Applies to every crate of the workspace.
include = [{ path = "local.toml", optional = true }]

# lld through clang on Linux x86_64.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# OpenTUI's native library (libopentui.so + opentui.h): `bun scripts/opentui-native.ts` writes it here.
[env]
OPENTUI_LIB_DIR = { value = "target/opentui-native", relative = true }
