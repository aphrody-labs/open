# ai-router on every desktop platform: the crate's tests, a release build of the library and CLI, and the Bun
# binding's tests against that build. RUSTUP_TOOLCHAIN (nightly, or stable for the static image) overrides the dated
# nightly that rust-toolchain.toml pins for the workspace.
name: ai-router
on:
  push:
    paths: ["crates/ai-router/**", "crates/c-abi/**", "packages/ai-router/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ai-router.yml"]
  pull_request:
    paths: ["crates/ai-router/**", "packages/ai-router/**"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            crates
            packages/ai-router
            .cargo
          sparse-checkout-cone-mode: true
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y lld
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo test -p ai-router
      - run: cargo build --release -p ai-router
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Bun binding against the release build
        working-directory: packages/ai-router
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) lib=ai_router.dll ;;
            macOS) lib=libai_router.dylib ;;
            *) lib=libai_router.so ;;
          esac
          AI_ROUTER_LIB="$GITHUB_WORKSPACE/target/release/$lib" bun test
      - uses: actions/upload-artifact@v7
        with:
          name: ai-router-${{ runner.os }}
          path: |
            target/release/ai-router*
            target/release/*ai_router.*
            crates/ai-router/include/ai_router.h
  image:
    # the service image, published for container platforms; built from a static binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            crates
            .cargo
          sparse-checkout-cone-mode: true
      - run: sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: cargo build --release -p ai-router --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/ai-router crates/ai-router/deploy/
      - name: Build, check and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ai-router
        run: |
          docker build -f crates/ai-router/deploy/Containerfile -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" crates/ai-router/deploy
          docker run -d --name air -e AI_ROUTER_TOKENS=ci-check -p 8080:8080 "$IMAGE:latest"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 2; done
          # /v1 answers a caller with a token and refuses one without
          curl -sf -H "Authorization: Bearer ci-check" http://127.0.0.1:8080/v1/models > /dev/null
          test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/models)" = 401
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
