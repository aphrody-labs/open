name: upstream

# Follows the upstream of every lock entry that names one (the Material 3 libraries and any other fork): each day
# the entries are re-imported at their newest commit (from the upstream directly when the fork carries no commits of
# its own), and the change is committed to main when the tree moved.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: re-import the entries with an upstream
        run: bun scripts/sync.ts --update --forks
      - name: commit when the tree moved
        run: |
          git add -A ecosystem open.lock.json
          if git diff --cached --quiet; then
            echo "no upstream change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "upstream: follow the newest commits of the forked libraries"
          git push origin HEAD:main
