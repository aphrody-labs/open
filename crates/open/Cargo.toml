[package]
name = "open"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "open: the one framework of the workspace. Re-exports the surfaces (browse, crawl, tunnel, tui, ui, router, engines, C ABI) and ships the `open` command"

build = "build.rs"

[lib]
name = "open"

[[bin]]
name = "open"
path = "src/main.rs"

[features]
default = ["engines", "crawl", "browse", "tunnel", "router"]
engines = ["dep:browser-engines"]
crawl = ["engines", "dep:crawl"]
browse = ["engines", "dep:browse"]
tunnel = ["dep:tunnel"]
router = ["dep:ai-router"]
# OpenTUI's native library must be present (scripts/opentui-native.ts).
tui = ["router", "dep:tui"]
# Rune: the native GPU UI framework of anomalyco, pinned by git revision.
ui = ["dep:rune", "dep:rune-kit", "dep:rune-motion"]
c-abi = ["dep:c-abi"]

[dependencies]
ai-router = { workspace = true, optional = true }
browse = { workspace = true, optional = true }
browser-engines = { workspace = true, optional = true }
c-abi = { workspace = true, optional = true }
crawl = { workspace = true, optional = true }
rune = { workspace = true, optional = true }
rune-kit = { workspace = true, optional = true }
rune-motion = { workspace = true, optional = true }
tui = { workspace = true, optional = true }
tunnel = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
